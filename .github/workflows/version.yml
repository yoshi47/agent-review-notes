name: Version

# Opens (and keeps updating) the Version Packages PR from the changesets on
# main. Merging that PR changes package.json, which release.yml publishes.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # changeset version leaves package-lock.json at the old version.
      - name: Open the Version Packages PR
        uses: changesets/action@v2
        with:
          version-script: npx changeset version && npm install --package-lock-only
          commit-message: Version Packages
          pr-title: Version Packages
