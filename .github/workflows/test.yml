name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  vscode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest stable, and the oldest version engines.vscode allows.
        version: [stable, 1.80.0]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # VS Code needs a display; the runner has none.
      - run: xvfb-run -a npm run test:vscode
